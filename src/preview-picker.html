<!doctype html>
<html lang="zh-Hant" data-title-i18n="picker.title">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>選擇 Markdown</title>
    <link rel="stylesheet" href="./preview-picker.css">
  </head>
  <body>
    <main class="dialog" role="dialog" aria-modal="true" aria-labelledby="title">
      <header>
        <div class="brand"><img src="../assets/tray.png" alt=""><span>Floade</span></div>
        <div class="window-actions">
          <button id="pin" class="icon-button" type="button" data-i18n-title="common.pin">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 5 3 3v2h-4v8l-2-2v-6H7v-2l3-3-1-5Z"/></svg>
          </button>
          <button id="close" class="close" type="button" data-i18n-title="common.close">×</button>
        </div>
      </header>
      <section>
        <h1 id="title" data-i18n="picker.heading">選擇要顯示的 Markdown</h1>
        <p id="folder" class="folder"></p>
        <input id="search" type="search" data-i18n-placeholder="picker.search" autocomplete="off">
        <div id="files" class="files"></div>
      </section>
      <footer>
        <span id="selection-count" data-i18n="picker.noneSelected">尚未選擇</span>
        <button id="open" class="primary" type="button" disabled data-i18n="picker.open">顯示選取項目</button>
      </footer>
    </main>
    <script src="./i18n-renderer.js"></script>
    <script src="./preview-picker.js"></script>
  </body>
</html>
