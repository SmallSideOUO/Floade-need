<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Markdown</title>
    <link rel="stylesheet" href="./markdown-preview.css">
  </head>
  <body>
    <main class="preview">
      <header>
        <div class="document-title">
          <img src="../assets/tray.png" alt="">
          <div>
            <strong id="name">Markdown</strong>
            <span id="path"></span>
          </div>
        </div>
        <div class="window-actions">
          <button id="pin" class="icon-button" type="button" aria-label="置頂" title="置頂">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 5 3 3v2h-4v8l-2-2v-6H7v-2l3-3-1-5Z"/></svg>
          </button>
          <button id="close" class="close" type="button" aria-label="關閉">×</button>
        </div>
      </header>
      <textarea id="editor" aria-label="Markdown 內容" spellcheck="false"></textarea>
      <footer>
        <span>Markdown</span>
        <span id="status">已載入</span>
      </footer>
    </main>
    <script src="./markdown-preview.js"></script>
  </body>
</html>
