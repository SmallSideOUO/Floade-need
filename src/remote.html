<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Floade 遠端</title><link rel="stylesheet" href="remote.css"></head>
<body><header><div class="brand"><img src="../assets/tray.png" alt=""><strong>Floade <span data-en="Remote">遠端</span></strong></div><button id="close" aria-label="Close">×</button></header>
<nav><button data-view="connect" class="selected" data-en="Connect">連線</button><button data-view="settings" data-en="Remote settings">遠端設定</button></nav>
<main><p id="message" role="status"></p>
<section id="connect-view"><article class="identity"><div><small data-en="This device">這部裝置</small><strong id="device-id">—</strong><span id="engine-status" data-en="Starting remote engine…">正在啟動遠端引擎…</span></div><button id="copy-id" data-en="Copy code">複製代碼</button></article>
<article><h2 data-en="Connect to a device">連線至裝置</h2><form id="connect-form"><label><span data-en="Device code">裝置代碼</span><input id="peer-id" inputmode="numeric" autocomplete="off" placeholder="123 456 789" required></label><label><span data-en="Password">密碼</span><input id="peer-password" type="password" autocomplete="off" placeholder=""></label><label><span data-en="Device name (optional)">裝置名稱（選填）</span><input id="peer-alias" maxlength="80" placeholder=""></label><div class="row"><label class="toggle"><input id="remember" type="checkbox"><span data-en="Remember password on this device">在這部裝置記住密碼</span></label><button class="primary" type="submit" data-en="Connect">連線</button><button id="files" type="button" data-en="Files">傳輸檔案</button></div></form></article>
<article><h2 data-en="Recent devices">最近裝置</h2><div id="devices"></div></article>
<article><h2 data-en="Allow someone to connect">讓對方連線</h2><p data-en="Share your device code and a temporary password with someone you trust.">將裝置代碼與臨時密碼提供給你信任的人。</p><button id="temporary" data-en="Show temporary password">顯示臨時密碼</button><output id="temporary-password"></output></article></section>
<section id="settings-view" hidden><form id="settings-form"><article><h2 data-en="Connection and permissions">連線與權限</h2><div id="toggles"></div><label><span data-en="Connection approval">連線授權方式</span><select id="approval"><option value="password" data-en="Require password">需要密碼</option></select></label><label><span data-en="Password mode">密碼模式</span><select id="verification"><option value="use-both-passwords" data-en="Permanent and temporary passwords">固定及臨時密碼</option><option value="use-permanent-password" data-en="Permanent password only">只使用固定密碼</option><option value="use-temporary-password" data-en="Temporary password only">只使用臨時密碼</option></select></label></article>
<article><h2 data-en="Picture and performance">畫面與效能</h2><div class="columns"><label>FPS<input id="fps" type="number" min="10" max="120"></label><label><span data-en="Quality (10–100)">畫質（10–100）</span><input id="quality" type="number" min="10" max="100"></label><label><span data-en="Codec">編碼</span><select id="codec"><option value="auto">Auto</option><option value="h264">H.264</option><option value="h265">H.265</option><option value="vp8">VP8</option><option value="vp9">VP9</option><option value="av1">AV1</option></select></label></div><p data-en="Display preferences apply to new connections. Actual FPS depends on both devices and network; direct connection falls back to relay when needed.">畫面設定套用至新連線。實際 FPS 取決於兩端與網路；直連失敗時會使用中繼。</p></article>
<article><h2 data-en="Server">伺服器</h2><p data-en="Leave blank to use the engine default server.">留白使用引擎預設伺服器。</p><label>ID Server<input id="server" autocomplete="off"></label><label>Relay Server<input id="relayServer" autocomplete="off"></label><label>Server Key<input id="serverKey" autocomplete="off"></label></article><button class="primary" type="submit" data-en="Save settings">儲存設定</button></form>
<article><h2 data-en="Permanent password">固定密碼</h2><form id="password-form"><label><span data-en="New password (at least 8 characters)">新密碼（至少 8 個字元）</span><input id="host-password" type="password" minlength="8" autocomplete="new-password" required></label><button type="submit" data-en="Set password">設定密碼</button></form></article>
<article><h2 data-en="Advanced tools">進階工具</h2><p data-en="Native remote tools include multiple displays, file transfer, connection approval, and service installation for login-screen access.">原生工具保留多螢幕、檔案傳輸、連線授權，以及登入畫面存取需要的服務安裝。</p><button id="advanced" data-en="Open advanced tools">開啟進階工具</button></article></section>
<footer><span data-en="Powered by the modified RustDesk open-source engine · AGPL-3.0">採用修改版 RustDesk 開源引擎 · AGPL-3.0</span> <button id="legal" data-en="Source and license">開源與授權</button></footer></main><script src="remote.js"></script></body></html>
