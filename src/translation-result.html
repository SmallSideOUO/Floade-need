<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Floade 翻譯</title>
    <link rel="stylesheet" href="./translation-result.css">
  </head>
  <body>
    <main class="window">
      <header>
        <div class="brand"><img src="../assets/tray.png" alt=""><span>Floade 翻譯</span></div>
        <div class="window-actions">
          <button id="pin" class="icon-button" type="button" title="置頂" aria-label="置頂">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 5 3 3v2h-4v8l-2-2v-6H7v-2l3-3-1-5Z"/></svg>
          </button>
          <button id="close" class="close" type="button" title="關閉" aria-label="關閉">×</button>
        </div>
      </header>
      <section class="content">
        <div class="language-row">
          <select id="source-language" aria-label="來源語言">
            <option value="auto">自動偵測</option>
          </select>
          <button id="swap" type="button" title="翻轉語言" aria-label="翻轉語言">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3 1.4-1.4L22 8l-5.6 5.4L15 12l3-3H7V7Zm10 10H6l3 3-1.4 1.4L2 16l5.6-5.4L9 12l-3 3h11v2Z"/></svg>
          </button>
          <select id="target-language" aria-label="目標語言"></select>
          <small id="confidence"></small>
        </div>
        <article class="source-card">
          <div class="section-title"><h2>OCR 原文</h2></div>
          <textarea id="source" class="text" aria-label="原文" spellcheck="true"></textarea>
        </article>
        <article class="translation-card">
          <div class="section-title"><h2>翻譯</h2><button id="copy" type="button">複製</button></div>
          <textarea id="translation" class="text result" aria-label="翻譯內容" spellcheck="true"></textarea>
        </article>
        <div class="footer-row"><p class="provider">本機 OCR · Google 翻譯</p><p id="status" aria-live="polite"></p></div>
      </section>
    </main>
    <script src="./translation-result.js"></script>
  </body>
</html>
