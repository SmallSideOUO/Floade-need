<!doctype html>
<html lang="zh-Hant" data-title-i18n="translation.title">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Floade 翻譯</title>
    <link rel="stylesheet" href="./translation-result.css">
  </head>
  <body>
    <main class="window">
      <header>
        <div class="brand"><img src="../assets/tray.png" alt=""><span data-i18n="translation.title">Floade 翻譯</span></div>
        <div class="window-actions">
          <button id="pin" class="icon-button" type="button" data-i18n-title="common.pin">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 5 3 3v2h-4v8l-2-2v-6H7v-2l3-3-1-5Z"/></svg>
          </button>
          <button id="close" class="close" type="button" data-i18n-title="common.close">×</button>
        </div>
      </header>
      <section class="content">
        <div class="language-row">
          <select id="source-language" data-i18n-aria="translation.sourceLanguage">
            <option value="auto" data-i18n="translation.auto">自動偵測</option>
          </select>
          <button id="swap" type="button" data-i18n-title="translation.swap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3 1.4-1.4L22 8l-5.6 5.4L15 12l3-3H7V7Zm10 10H6l3 3-1.4 1.4L2 16l5.6-5.4L9 12l-3 3h11v2Z"/></svg>
          </button>
          <select id="target-language" data-i18n-aria="translation.targetLanguage"></select>
          <small id="confidence"></small>
        </div>
        <article class="source-card">
          <div class="section-title"><h2 data-i18n="translation.source">OCR 原文</h2></div>
          <textarea id="source" class="text" data-i18n-aria="translation.sourceLabel" spellcheck="true"></textarea>
        </article>
        <article class="translation-card">
          <div class="section-title"><h2 data-i18n="translation.result">翻譯</h2><button id="copy" type="button" data-i18n="translation.copy">複製</button></div>
          <textarea id="translation" class="text result" data-i18n-aria="translation.resultLabel" spellcheck="true"></textarea>
        </article>
        <div class="footer-row"><p class="provider" data-i18n="translation.provider">本機 OCR · Google 翻譯</p><p id="status" aria-live="polite"></p></div>
      </section>
    </main>
    <script src="./i18n-renderer.js"></script>
    <script src="./translation-result.js"></script>
  </body>
</html>
