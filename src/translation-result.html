<!doctype html>
<html lang="zh-Hant" data-title-i18n="translation.title">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Floade 翻譯</title>
    <link rel="stylesheet" href="./translation-result.css">
  </head>
  <body>
    <main class="window">
      <header>
        <div class="brand"><img src="../assets/tray.png" alt=""><span data-i18n="translation.title">Floade 翻譯</span></div>
        <div class="window-actions">
          <button id="pin" class="icon-button" type="button" data-i18n-title="common.pin">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l-1 5 3 3v2h-4v8l-2-2v-6H7v-2l3-3-1-5Z"/></svg>
          </button>
          <button id="close" class="close" type="button" data-i18n-title="common.close">×</button>
        </div>
      </header>
      <section class="content">
        <div class="language-row">
          <label class="language-field"><span data-i18n="translation.sourceLanguage">上方語言</span><select id="source-language">
            <option value="auto" data-i18n="translation.auto">自動偵測</option>
          </select></label>
          <label class="language-field"><span data-i18n="translation.targetLanguage">下方語言</span><select id="target-language"></select></label>
          <small id="confidence"></small>
        </div>
        <article class="source-card">
          <div class="section-title"><h2 data-i18n="translation.source">原文</h2><button id="translate" type="button" data-i18n="translation.translate" data-i18n-title="translation.shortcut" disabled>翻譯</button></div>
          <textarea id="source" class="text" data-i18n-aria="translation.sourceLabel" data-i18n-placeholder="translation.placeholder" spellcheck="true"></textarea>
        </article>
        <article class="translation-card">
          <div class="section-title"><h2 data-i18n="translation.result">翻譯</h2><button id="copy" type="button" data-i18n="translation.copy">複製</button></div>
          <textarea id="translation" class="text result" data-i18n-aria="translation.resultLabel" data-i18n-placeholder="translation.reversePlaceholder" spellcheck="true"></textarea>
        </article>
        <div class="footer-row"><p id="provider" class="provider" data-i18n="translation.textProvider">Google 翻譯 · 上下皆可輸入，自動雙向翻譯</p><p id="status" aria-live="polite"></p></div>
      </section>
    </main>
    <script src="./i18n-renderer.js"></script>
    <script src="./translation-result.js"></script>
  </body>
</html>
