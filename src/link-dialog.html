<!doctype html>
<html lang="zh-Hant" data-title-i18n="link.title">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Link GitHub Repo</title>
    <link rel="stylesheet" href="./link-dialog.css">
  </head>
  <body>
    <main class="dialog" role="dialog" aria-modal="true" aria-labelledby="title">
      <header>
        <div class="brand"><img src="../assets/tray.png" alt=""><span>Floade</span></div>
        <button id="close" class="close" type="button" data-i18n-title="common.close">×</button>
      </header>
      <section>
        <h1 id="title" data-i18n="link.title">選擇 Private Repo</h1>
        <input id="search" type="search" data-i18n-placeholder="link.search" autocomplete="off">
        <div id="repositories" class="repositories"></div>
      </section>
    </main>
    <script src="./i18n-renderer.js"></script>
    <script src="./link-dialog.js"></script>
  </body>
</html>
