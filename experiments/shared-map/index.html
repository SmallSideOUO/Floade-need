<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>共用地圖</title><link rel="stylesheet" href="map.css"></head>
<body><header><div class="brand"><i></i><strong>共用地圖</strong><span>Floade</span></div><span class="focus" aria-live="polite"></span></header>
<main><nav id="outline-panel" aria-label="由大到小的脈絡"><h1>由大到小</h1><p>上層目的 → 下層細項<br>這是脈絡，不是執行順序。</p><div id="outline"></div><div class="line-key"><span>實線：上層與細項</span><span>虛線：跨分支關聯</span></div></nav><div id="canvas" aria-label="思考地圖：右鍵在該位置新增，中鍵按住移動，左鍵拖曳物件，滾輪縮放"><div id="context-trail" aria-label="目前工作的上層脈絡"></div><svg id="lines" aria-hidden="true"></svg><div id="nodes"></div><div class="zoom"><button data-action="minus" aria-label="縮小">−</button><span id="scale"></span><button data-action="plus" aria-label="放大">＋</button></div></div>
<aside hidden><div class="inspector-heading"><span id="selection">正在看這裡</span><button data-action="close" aria-label="收起編輯">×</button></div><section id="node-editor"><label>念頭<input id="title" maxlength="160"></label><label>上層目的／議題<select id="parent"></select></label><p class="parent-explainer">可留在最外層。這是脈絡，不強迫執行順序。</p><label>形狀<select id="shape"><option value="ellipse">橢圓</option><option value="circle">圓形</option><option value="diamond">菱形</option><option value="rounded">圓角矩形</option><option value="rectangle">矩形</option></select></label><div class="colors"><label>背景色<input id="background" type="color" value="#17171b"></label><label>文字色<input id="text-color" type="color" value="#eeeef1"></label></div><div class="dimensions"><label>寬<input id="width" type="number" min="70" max="600" step="10"></label><label>高<input id="height" type="number" min="50" max="500" step="10"></label></div><label>不透明度 <span id="opacity-value">100%</span><input id="opacity" type="range" min="0" max="100" value="100"></label><div class="privacy-fields"><label>AI 讀取<select id="ai-visibility"><option value="full">完整可讀</option><option value="text">隱藏文字</option><option value="object">隱藏整個物件</option></select></label><label>畫面<select id="visual-visibility"><option value="full">正常顯示</option><option value="text">遮蔽文字</option><option value="object">隱藏整個物件</option></select></label></div><button data-action="reveal" hidden>暫時顯示這個物件的文字</button><label>想多說一點<textarea id="note" rows="4" placeholder="也可以留白"></textarea></label><div id="related"></div><div class="inspector-actions"><button data-action="connect">連線到…</button><button data-action="focus">設為手上這件事</button><button data-action="delete" class="quiet">刪除</button></div></section><section id="edge-editor" hidden><div id="edge-name"></div><label>關係，可以不命名<input id="edge-label" maxlength="80"></label><button data-action="edge-delete">刪除連線</button></section></aside></main>
<footer><div class="privacy-controls"><label>AI<select id="ai-mode"><option value="protected">依物件設定</option><option value="open">全部開放</option></select></label><label>畫面<select id="visual-mode"><option value="selective">依物件設定</option><option value="show">全部顯示</option><option value="mask">遮蔽全部文字</option></select></label></div><span id="save-status" role="status">載入中…</span></footer><div class="bottom-hint"><span id="hint">右鍵新增 · 中鍵移動 · 左鍵拖物件 · 滾輪縮放 · F 看全圖</span><span>AI 讀取以 ai-map.json 為準</span></div>
<script src="hierarchy.cjs"></script><script src="renderer.js"></script></body></html>
