<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>共用地圖</title>
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <main id="canvas" aria-label="思考地圖：右鍵開啟選單，中鍵移動，左鍵拖曳物件，點物件開啟面板">
    <svg id="lines" aria-label="物件連線"></svg>
    <div id="nodes"></div>
    <div id="panels"></div>
    <div id="context-menu" role="menu" hidden>
      <button role="menuitem" data-menu="create">新增物件</button>
      <button role="menuitem" data-menu="delete" hidden>刪除物件</button>
    </div>
    <div class="zoom"><button data-action="minus" aria-label="縮小">−</button><span id="scale"></span><button data-action="plus" aria-label="放大">＋</button></div>
  </main>
  <footer>
    <div class="privacy-controls">
      <label>AI<select id="ai-mode"><option value="protected">依物件設定</option><option value="open">全部開放</option></select></label>
      <label>畫面<select id="visual-mode"><option value="selective">依物件設定</option><option value="show">全部顯示</option><option value="mask">遮蔽全部文字</option></select></label>
    </div>
    <span id="save-status" role="status">載入中…</span>
  </footer>
  <div class="bottom-hint"><span id="hint">右鍵新增／刪除 · 中鍵移動 · 拖圓點連線 · 點線調整樣式 · F 看全圖</span><span>AI 讀取以 ai-map.json 為準</span></div>
  <template id="node-panel-template">
    <div class="panel-heading"><strong data-heading></strong><button data-action="close" aria-label="關閉這個物件面板">×</button></div>
    <div class="panel-body">
      <label>想法<input data-field="title" maxlength="160"></label>
      <label>想多說一點<textarea data-field="note" rows="3" placeholder="也可以留白"></textarea></label>
      <button data-action="reveal" hidden>暫時顯示這個物件的文字</button>
      <div class="privacy-fields">
        <label>AI 讀取<select data-field="aiVisibility"><option value="full">完整可讀</option><option value="text">隱藏文字</option><option value="object">隱藏整個物件</option></select></label>
        <label>畫面<select data-field="visualVisibility"><option value="full">正常顯示</option><option value="text">遮蔽文字</option><option value="object">隱藏整個物件</option></select></label>
      </div>
      <details><summary>外觀</summary>
        <label>形狀<select data-field="shape"><option value="ellipse">橢圓</option><option value="circle">圓形</option><option value="diamond">菱形</option><option value="rounded">圓角矩形</option><option value="rectangle">矩形</option></select></label>
        <div class="colors"><label>背景色<input data-field="background" type="color"></label><label>文字色<input data-field="textColor" type="color"></label></div>
        <div class="dimensions"><label>寬<input data-field="width" type="number" min="70" max="600"></label><label>高<input data-field="height" type="number" min="50" max="500"></label></div>
        <label>不透明度 <span data-opacity></span><input data-field="opacity" type="range" min="0" max="100"></label>
      </details>
      <div data-related class="related"></div>
      <div class="panel-actions"><button data-action="delete" class="quiet">刪除</button></div>
    </div>
  </template>
  <template id="edge-panel-template">
    <div class="panel-heading"><strong data-heading></strong><button data-action="close" aria-label="關閉這個連線面板">×</button></div>
    <div class="panel-body"><label>關係，可以不命名<input data-field="edgeLabel" maxlength="80"></label><div class="colors"><label>顏色<input data-field="edgeColor" type="color"></label><label>粗細<input data-field="edgeWidth" type="number" min="0.5" max="12" step="0.5"></label></div><label>線條<select data-field="edgeStyle"><option value="solid">實線</option><option value="dashed">虛線</option></select></label><label>路徑<select data-field="edgeRouting"><option value="curve">平滑曲線</option><option value="rounded">圓角折線</option></select></label><label>彎曲程度<input data-field="edgeCurvature" type="range" min="0" max="100"></label><label>偏移<input data-field="edgeOffset" type="number" min="-1000" max="1000"></label><div class="panel-actions"><button data-action="edge-auto">回到自動連線</button><button data-action="edge-delete">刪除連線</button></div></div>
  </template>
  <script src="connections.cjs"></script><script src="renderer.js"></script>
</body>
</html>
